<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="跑步训练">
<title>跑步训练流程控制器</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<style>
  :root {
    --primary: #3b82f6;
    --active-bg: #eff6ff;
    --text-main: #0f172a;
    --text-sub: #64748b;
    --sidebar-w: 260px;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    margin: 0;
    background-color: #f8fafc;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* === 布局 === */
  #app-container {
    display: flex;
    width: 100%;
    height: 100%;
  }

  /* 侧边栏 */
  #sidebar {
    width: var(--sidebar-w);
    background: white;
    border-right: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }

  .category-tabs {
    display: flex;
    padding: 10px;
    gap: 5px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
  }

  .tab-btn {
    flex: 1;
    padding: 8px 4px;
    font-size: 12px;
    border: 1px solid #e2e8f0;
    background: #f1f5f9;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    color: var(--text-sub);
  }
  .tab-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  #playlist {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }

  .playlist-item {
    padding: 12px;
    margin-bottom: 6px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
  }

  .playlist-item:hover { background: #f8fafc; }
  
  .playlist-item.active {
    background: var(--active-bg);
    border-color: #bfdbfe;
  }
  
  .playlist-item.done { opacity: 0.5; }

  .item-name { font-size: 14px; font-weight: 600; color: var(--text-main); }
  .item-time { font-size: 12px; color: var(--text-sub); }
  
  /* 标签样式 */
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
  .badge-reps { background: #e0f2fe; color: #0284c7; }

  /* 主视图 */
  #main-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 20px;
  }

  /* 计时器卡片 */
  #timer-card {
    background: white;
    padding: 40px;
    border-radius: 30px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
    text-align: center;
    width: 100%;
    max-width: 400px;
    transition: transform 0.3s ease;
  }

  .status-tag {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 20px;
    background: #e2e8f0; color: #475569;
  }
  .status-tag.work { background: #dbeafe; color: #1e40af; }
  .status-tag.rest { background: #dcfce7; color: #166534; }

  #current-action { font-size: 32px; font-weight: 800; margin: 0 0 10px 0; line-height: 1.1; color: var(--text-main); }
  #current-detail { font-size: 18px; color: var(--primary); font-weight: 500; min-height: 27px; }

  #display {
    font-size: 80px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -3px;
    margin: 10px 0;
    color: var(--text-main);
    line-height: 1;
  }
  
  #sub-display {
    font-size: 16px;
    color: #94a3b8;
    height: 20px;
    font-weight: 600;
  }

  .controls {
    display: flex;
    gap: 15px;
    margin-top: 30px;
  }

  .btn {
    border: none;
    padding: 16px 24px;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    flex: 1;
    transition: transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: var(--text-main); color: white; flex: 2; }
  .btn-sec { background: #f1f5f9; color: var(--text-main); }

  @media (max-width: 768px) {
    #app-container { flex-direction: column-reverse; }
    #sidebar { width: 100%; height: 40%; border-right: none; border-top: 1px solid #e2e8f0; }
    #main-view { height: 60%; }
    #timer-card { padding: 20px; box-shadow: none; background: transparent; }
    #display { font-size: 72px; }
    #current-action { font-size: 24px; }
  }
</style>
</head>
<body>

<div id="app-container">
  <!-- 左侧 -->
  <div id="sidebar">
    <div class="category-tabs">
      <button class="tab-btn" onclick="app.loadCategory('activation')">🔥 跑前激活</button>
      <button class="tab-btn active" onclick="app.loadCategory('stretch')">🧘 跑后拉伸</button>
      <button class="tab-btn" onclick="app.loadCategory('strength')">💪 力量强化</button>
    </div>
    <div id="playlist"></div>
  </div>

  <!-- 右侧 -->
  <div id="main-view">
    <div id="timer-card">
      <div id="status-tag" class="status-tag">准备</div>
      <h1 id="current-action">选择模式</h1>
      <div id="current-detail">点击左侧列表开始</div>
      <div id="display">00.0</div>
      <div id="sub-display"></div> <!-- 显示倒计时/提示 -->
      
      <div class="controls">
        <button class="btn btn-sec" onclick="app.skip(-1)"><img src="back.svg" alt="icon"></button>
        <button class="btn btn-primary" id="toggle-btn" onclick="app.toggle();keepAwake()">开始</button>
        <button class="btn btn-sec" onclick="app.skip(1)"><img src="forward.svg" alt="icon"></button>
      </div>
      <div style="margin-top:15px; font-size:12px; color:#94a3b8; cursor:pointer;" onclick="app.reset()">按 R 重置</div>
    </div>
  </div>
</div>

<script>
let wakeLock = null;
async function keepAwake() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    console.log('屏幕已保持常亮');

    wakeLock.addEventListener('release', () => {
      console.log('Wake Lock 被释放');
    });
  } catch (err) {
    console.error('Wake Lock 失败:', err);
  }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && !wakeLock) {
    await keepAwake();
  }
});

const app = (function() {
  // === 数据配置 (还原您的原始计划 + 修改侧抬腿) ===
  const DATA = {
    // 1. 跑前激活
    activation: {
      work: 30, rest: 3,
      items: [
        // 修改：增加 mode:'reps', count:次数, interval:单次秒数
        // 15次，每次2秒，共30秒
        { name: "站姿侧抬腿", detail: "左侧", mode: 'reps', count: 15, interval: 1.2 },
        { name: "站姿侧抬腿", detail: "右侧", mode: 'reps', count: 15, interval: 1.2 },
        // 原始：
        { name: "靠墙静蹲", detail: "" },
      ]
    },
    // 2. 跑后拉伸 (原始数据)
    stretch: {
      work: 45, rest: 10,
      items: [
        { name: "股四头肌拉伸", detail: "左侧 (大腿前侧)" },
        { name: "股四头肌拉伸", detail: "右侧 (大腿前侧)" },
        { name: "胭绳肌拉伸", detail: "左侧 (大腿后侧)" },
        { name: "胭绳肌拉伸", detail: "右侧 (大腿后侧)" },
        { name: "ITB 髂胫束", detail: "左侧 (双脚交叉)" },
        { name: "ITB 髂胫束", detail: "右侧 (双脚交叉)" },
        { name: "腓肠肌拉伸", detail: "左侧 (小腿后侧直腿)" },
        { name: "腓肠肌拉伸", detail: "右侧 (小腿后侧直腿)" },
        { name: "比目鱼肌拉伸", detail: "左侧 (小腿后侧屈膝)" },
        { name: "比目鱼肌拉伸", detail: "右侧 (小腿后侧屈膝)" }
      ]
    },
    // 3. 力量强化 (原始数据)
    strength: {
      work: 50, rest: 15,
      items: [
        { name: "靠墙静蹲", detail: "" },
        { name: "靠墙静蹲", detail: "" },
        { name: "靠墙静蹲", detail: "" },
        { name: "靠墙静蹲", detail: "" },
        { name: "靠墙静蹲", detail: "" },
        { name: "靠墙静蹲", detail: "" },
      ]
    }
  };

  // === 状态变量 ===
  let currentCategory = 'stretch';
  let queue = [];
  let cursor = 0;
  let timeLeft = 0;
  let isRunning = false;
  let rafId = null;
  let lastTime = null;
  let audioCtx = null;
  
  // 专门用于Rep模式记录上一声滴是在第几次
  let lastBeepRepIndex = 0;

  // === DOM ===
  const els = {
    playlist: document.getElementById('playlist'),
    tabs: document.querySelectorAll('.tab-btn'),
    display: document.getElementById('display'),
    subDisplay: document.getElementById('sub-display'),
    action: document.getElementById('current-action'),
    detail: document.getElementById('current-detail'),
    tag: document.getElementById('status-tag'),
    btnToggle: document.getElementById('toggle-btn')
  };

  function init() {
    loadCategory('strength');
    setupAudio();
  }

  function loadCategory(key) {
    currentCategory = key;
    
    els.tabs.forEach(t => t.classList.remove('active'));
    const targetTab = Array.from(els.tabs).find(t => t.innerText.includes(key==='activation'?'激活':key==='stretch'?'拉伸':'强化'));
    if(targetTab) targetTab.classList.add('active');

    const cfg = DATA[key];
    queue = [];
    queue.push({ type: 'prep', name: '准备开始', detail: '调整呼吸', duration: 3 });
    
    cfg.items.forEach((item, idx) => {
      // 这里的逻辑：如果是次数模式，时长由次数决定；否则由分类默认值决定
      let duration = cfg.work;
      let mode = 'time';
      let count = 0, interval = 0;

      if (item.mode === 'reps') {
        mode = 'reps';
        count = item.count;
        interval = item.interval;
        duration = count * interval; // 自动计算总时长
      }

      queue.push({ 
        type: 'work', 
        name: item.name, 
        detail: item.detail, 
        duration: duration, 
        refIndex: idx,
        total: cfg.items.length,
        mode: mode,
        count: count,
        interval: interval
      });

      if (idx < cfg.items.length - 1) {
        queue.push({ 
          type: 'rest', 
          name: '休息', 
          detail: `Next: ${cfg.items[idx+1].name}`, 
          duration: cfg.rest,
          refIndex: idx 
        });
      }
    });
    
    queue.push({ type: 'finish', name: '训练完成', detail: 'Nice Work!', duration: 0 });

    cursor = 0;
    isRunning = false;
    timeLeft = queue[0].duration;
    cancelAnimationFrame(rafId);
    renderPlaylist();
    renderUI();
  }

  function renderPlaylist() {
    const items = DATA[currentCategory].items;
    els.playlist.innerHTML = items.map((item, idx) => {
      let extra = "";
      if (item.mode === 'reps') {
        extra = `<span class="badge badge-reps">${item.count}次</span>`;
      }
      return `
      <div class="playlist-item" id="pl-item-${idx}" onclick="app.jumpTo(${idx})">
        <div>
          <div class="item-name">${idx + 1}. ${item.name} ${extra}</div>
          <div class="item-time">${item.detail}</div>
        </div>
        <div style="font-size:12px; color:#cbd5e1">${item.mode==='reps' ? (item.count*item.interval) : DATA[currentCategory].work}s</div>
      </div>
    `}).join('');
  }

  function jumpTo(itemIndex) {
    const qIndex = queue.findIndex(q => q.type === 'work' && q.refIndex === itemIndex);
    if (qIndex !== -1) {
      cursor = qIndex;
      timeLeft = queue[cursor].duration;
      lastBeepRepIndex = 0; // 重置滴声计数
      if (!isRunning) start();
      else lastTime = performance.now();
      
      speak(queue[cursor].name);
      renderUI();
    }
  }

  function skip(direction) {
    let newCursor = cursor + direction;
    if (direction === 1 && newCursor >= queue.length) return;
    if (direction === -1 && newCursor < 0) return;
    
    cursor = newCursor;
    timeLeft = queue[cursor].duration;
    lastBeepRepIndex = 0; 
    
    if (direction === 1 && !isRunning) start(); 
    else renderUI();
  }

  function toggle() {
    if (queue[cursor].type === 'finish') return;
    initAudioContext(); // 必须在点击时触发
    if (isRunning) pause(); else start();
  }

  function start() {
    if (isRunning) return;
    isRunning = true;
    lastTime = performance.now();
    rafId = requestAnimationFrame(tick);
    renderUI();
  }

  function pause() {
    isRunning = false;
    cancelAnimationFrame(rafId);
    renderUI();
  }

  function reset() {
    loadCategory(currentCategory);
  }

  // === 计时核心 ===
  function tick() {
    if (!isRunning) return;
    const now = performance.now();
    const delta = (now - lastTime) / 1000;
    lastTime = now;

    if (timeLeft > 0) {
      const prevTime = timeLeft;
      timeLeft -= delta;
      
      const step = queue[cursor];

      // 1. 普通倒计时滴声 (最后3秒)
      if (step.mode !== 'reps') {
         if (Math.ceil(timeLeft) <= 3 && Math.ceil(prevTime) > Math.ceil(timeLeft) && timeLeft > 0) {
            playBeep(600, 0.1); 
         }
      }
      
      // 2. 次数模式滴声 (按间隔)
      if (step.type === 'work' && step.mode === 'reps') {
         // 已经过去的时间
         const elapsed = step.duration - timeLeft;
         // 当前应该在第几个动作 (从1开始)
         // 例如 interval=2. elapsed=0.1 -> 第1个; elapsed=2.1 -> 第2个
         const currentRep = Math.floor(elapsed / step.interval) + 1;
         
         // 如果当前的 rep 编号变大了，说明进入了新的一次，滴一声
         // 注意：刚开始(currentRep=1)的时候也要滴
         if (currentRep > lastBeepRepIndex && currentRep <= step.count) {
            lastBeepRepIndex = currentRep;
            playBeep(880, 0.15); // 880Hz 更清脆，0.15s 更长一点
         }
      }

      renderUI();
      rafId = requestAnimationFrame(tick);
    } else {
      autoNext();
    }
  }

  function autoNext() {
    if (cursor >= queue.length - 1) {
      cursor = queue.length - 1;
      pause();
      playWin();
      renderUI();
      return;
    }

    cursor++;
    const step = queue[cursor];
    timeLeft = step.duration;
    lastBeepRepIndex = 0;

    // 语音播报
    if (step.type === 'work') {
      playBeep(440, 0.3);
      speak(step.name + (step.mode==='reps' ? "，准备" : ""));
    } else if (step.type === 'rest') {
      playBeep(880, 0.1);
      speak("休息");
    }

    lastTime = performance.now();
    rafId = requestAnimationFrame(tick);
    renderUI();
  }

  // === UI 渲染 ===
  function renderUI() {
    const step = queue[cursor];
    
    // 显示逻辑区分
    if (step.type === 'work' && step.mode === 'reps') {
       // 次数模式：显示次数
       const currentRep = Math.max(1, Math.min(step.count, lastBeepRepIndex || 1));
       els.display.innerText = `${currentRep} / ${step.count}`;
       els.subDisplay.innerText = "跟随节奏";
    } else {
       // 时间模式：显示秒数
       els.display.innerText = Math.max(0.0, timeLeft).toFixed(1);
       els.subDisplay.innerText = "";
    }

    els.action.innerText = step.name;
    els.detail.innerText = step.detail;
    els.btnToggle.innerText = isRunning ? "暂停" : (step.type === 'finish' ? "结束" : "开始");
    
    document.body.style.background = step.type === 'rest' ? '#f0fdf4' : '#f8fafc';
    
    if (step.type === 'work') {
      els.tag.className = 'status-tag work';
      els.tag.innerText = `训练中 ${step.refIndex+1}/${step.total}`;
      els.display.style.color = '#0f172a';
    } else if (step.type === 'rest') {
      els.tag.className = 'status-tag rest';
      els.tag.innerText = 'Rest';
      els.display.style.color = '#166534';
    } else {
      els.tag.className = 'status-tag';
      els.tag.innerText = step.type === 'prep' ? 'Ready' : 'Done';
      els.display.style.color = '#0f172a';
    }

    document.querySelectorAll('.playlist-item').forEach(d => {
        d.classList.remove('active'); d.classList.remove('done');
    });
    
    let targetIdx = -1;
    if (step.type === 'work') targetIdx = step.refIndex;
    else if (step.type === 'rest') targetIdx = queue[cursor+1]?.refIndex;
    
    if (targetIdx !== undefined && targetIdx !== -1) {
       const el = document.getElementById(`pl-item-${targetIdx}`);
       if (el) {
           el.classList.add('active');
           el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
       }
       for(let i=0; i<targetIdx; i++) {
          const prev = document.getElementById(`pl-item-${i}`);
          if(prev) prev.classList.add('done');
       }
    }
  }

  // === 音频系统 ===
  function setupAudio() {
    window.AudioContext = window.AudioContext || window.webkitAudioContext;
  }
  
  function initAudioContext() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playBeep(freq, dur) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    
    // 增加音量 (0.5比之前的0.1大很多)
    gain.gain.setValueAtTime(1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }

  function playWin() {
    if (!audioCtx) return;
    [400, 600, 800].forEach((f, i) => setTimeout(() => playBeep(f, 0.2), i*150));
    speak("训练完成");
  }

  function speak(txt) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(txt);
      msg.lang = 'zh-CN';
      msg.rate = 1.2;
      window.speechSynthesis.speak(msg);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') skip(1);
    else if (e.code === 'ArrowLeft') skip(-1);
    else if (e.key.toLowerCase() === 'r') reset();
  });

  init();

  return { loadCategory, jumpTo, toggle, skip, reset };
})();

// 注册 Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((registration) => {
        console.log('SW registered:', registration.scope);
      })
      .catch((error) => {
        console.log('SW registration failed:', error);
      });
  });
}
</script>
</body>
</html>
